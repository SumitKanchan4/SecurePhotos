[package]
name = "securephotos"
version = "0.3.0"
description = "A private photo library and vault that lives on your own drive"
authors = ["Sumit Kanchan"]
license = "MIT"
edition = "2021"

[lib]
name = "securephotos_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rfd = "0.15"
# OS secure random source for the engine access token (M5); already in the tree via tauri.
getrandom = "0.3"

# Kill-on-close job object for the engine (T1); already in the tree via tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
