[package]
name = "securephotos"
version = "2.0.0"
description = "Local-first SLM-powered desktop photo library & digital vault"
authors = ["SecurePhotos Team"]
edition = "2021"

[lib]
name = "securephotos_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
