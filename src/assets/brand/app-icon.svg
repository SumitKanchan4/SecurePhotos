<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SecurePhotos">
  <!-- SecurePhotos app icon (redesign, owner choice "C · Frosted glass, photos + lens").
       Frosted glass shield over two photos, lime-ringed lens, lime halo on a black tile.
       Used at every size, as the approved board showed it (R9b). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1C1C"/><stop offset="1" stop-color="#030303"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#C6FF00" stop-opacity="0.42"/><stop offset="1" stop-color="#C6FF00" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9FF7A"/><stop offset="1" stop-color="#7FA800"/></linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#3B3B3B"/><stop offset="1" stop-color="#050505"/></radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#halo)"/>
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="86" y="74" width="74" height="86" rx="6" fill="#6FA7C7" transform="rotate(-12 123 117)"/>
  <rect x="92" y="80" width="74" height="86" rx="6" fill="#FFB27A" transform="rotate(6 129 123)"/>
  <path transform="translate(45 36) scale(2.6)" d="M32 4 L54 12 V30 C54 44 44 54 32 60 C20 54 10 44 10 30 V12 Z" fill="url(#glass)" stroke="#C6FF00" stroke-opacity="0.85" stroke-width="1.6"/>
  <path d="M80 68 C101 61 118 57 128 53" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="134" cy="122" r="34" fill="url(#ring)"/>
  <circle cx="134" cy="122" r="27" fill="url(#lens)"/>
  <polygon points="134,106 148,114 148,130 134,138 120,130 120,114" fill="#060606" stroke="#C6FF00" stroke-opacity="0.4" stroke-width="2"/>
  <ellipse cx="124" cy="110" rx="8" ry="4.5" fill="#FFFFFF" opacity="0.6" transform="rotate(-32 124 110)"/>
</svg>
