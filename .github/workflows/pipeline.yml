name: SecurePhotos CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.0.8)'
        required: false
        default: 'v0.0.8'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Quality Gate (MANDATORY PREREQUISITE)
  # Runs on every push and pull request. If this fails, release
  # is strictly prevented from executing.
  # ─────────────────────────────────────────────────────────────
  validate:
    name: Quality Gate (Typecheck, Lint, Tests & Cargo Check)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust & Cargo Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run Python Unit Tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
          python -m unittest engine/tests/test_prerequisites_check.py

      - name: Install Frontend Dependencies
        run: npm install

      - name: Frontend Build & TypeScript Typecheck
        run: npm run build

      - name: Compile Backend Engine Sidecar
        shell: bash
        run: |
          pip install pyinstaller
          python scripts/build-engine.py

      - name: Rust Backend Type & Dependency Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build Desktop Installers & Publish Release
  # ONLY executes if 'validate' passes 100% AND it's a version tag
  # or manual workflow dispatch.
  # ─────────────────────────────────────────────────────────────
  release:
    name: Build Desktop Installers & Release
    needs: [validate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Version Metadata
        id: version_meta
        shell: bash
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          CLEAN_VER="${TAG#v}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust & Cargo Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Compile Backend Engine Sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt pyinstaller
          python scripts/build-engine.py

      - name: Build Desktop Installers (NSIS & MSI)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: 'SecurePhotos ${{ steps.version_meta.outputs.tag_name }}'
          body: |
            ## 🔒 SecurePhotos ${{ steps.version_meta.outputs.tag_name }} — Desktop Release
            
            Download the installer for your Windows PC below:
            - **`SecurePhotos_${{ steps.version_meta.outputs.clean_version }}_x64-setup.exe`**: 1-Click Windows Setup Installer (Recommended)
            - **`SecurePhotos_${{ steps.version_meta.outputs.clean_version }}_x64_en-US.msi`**: Enterprise Windows Installer Package
            
            ### ✨ Features & Capabilities
            - Bundled Standalone Python Backend Engine Sidecar (`securephotos-engine.exe`)
            - Instant zero-console launch (No console popups, 0ms startup delay)
            - High-Speed Offline Media Ingestion with 2-level thumbnail sharding
            - Zero-Trust AES-256-GCM Encrypted Vault & Multi-Slot Recovery
            - On-Device 4K AI Super-Resolution with AVIF space-saving compression
            - Representative Medoid Face Clustering & Social Affinity Close Ones
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/**/latest.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

