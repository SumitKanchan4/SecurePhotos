name: SecurePhotos CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version Bump Type'
        required: true
        type: choice
        default: 'patch'
        options:
          - 'patch'
          - 'minor'
          - 'major'
      distribution_mode:
        description: 'Distribution Mode'
        required: true
        type: choice
        default: 'test_build'
        options:
          - 'test_build'
          - 'public_release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Quality Gate (MANDATORY PREREQUISITE)
  # Runs on manual invocation. If this fails, packaging and
  # distribution are strictly prevented from executing.
  # ─────────────────────────────────────────────────────────────
  validate:
    name: Quality Gate (Typecheck, Lint, Full Test Suite & Cargo Check)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust & Cargo Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run Python Unit & Integration Tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt pytest pyinstaller
          pytest engine/tests

      - name: Install Frontend Dependencies
        run: npm install

      - name: Frontend Build & TypeScript Typecheck
        run: npm run build

      - name: Compile Backend Engine Sidecar
        shell: bash
        run: |
          python scripts/build-engine.py

      - name: Rust Backend Type & Dependency Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build Desktop Installers & Distribute
  # ONLY executes if 'validate' passes 100%.
  # Handles isolated test artifacts or public releases cleanly.
  # ─────────────────────────────────────────────────────────────
  package_and_release:
    name: Package Desktop Installer & Distribute
    needs: [validate]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Detect SemVer & Auto-Bump Manifests
        id: version_meta
        shell: bash
        run: |
          git fetch --tags
          python -m pip install --upgrade pip
          python scripts/release_version.py auto-bump --bump "${{ inputs.release_type }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust & Cargo Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Compile Backend Engine Sidecar
        shell: bash
        run: |
          pip install -r engine/requirements.txt pyinstaller
          python scripts/build-engine.py

      - name: Build Desktop Installer (NSIS)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Artifact Upload (Always available in Actions run summary) ──
      - name: Upload Installer to Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecurePhotos-${{ steps.version_meta.outputs.tag_name }}-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/**/latest.json
          if-no-files-found: error
          retention-days: 14

      # ── Public GitHub Release (Only if distribution_mode == 'public_release') ──
      - name: Publish Official GitHub Release
        if: inputs.distribution_mode == 'public_release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: 'SecurePhotos ${{ steps.version_meta.outputs.tag_name }}'
          draft: false
          prerelease: false
          body: |
            ## 🔒 SecurePhotos ${{ steps.version_meta.outputs.tag_name }} — Desktop Release
            
            Download the installer for your Windows PC below:
            - **`SecurePhotos_${{ steps.version_meta.outputs.next_version }}_x64-setup.exe`**: 1-Click Windows Setup Installer (Recommended, in-place upgrades)
            
            ### 🛡️ SmartScreen / First-Time Installation Notice
            - If Windows Defender SmartScreen displays *"Windows protected your PC"*, click **"More info"** &rarr; **"Run anyway"**.
            - This is standard for newly published releases before worldwide telemetry reputation is established.
            
            ### ✨ Features & Capabilities
            - In-place seamless upgrades (replaces app without requiring uninstall)
            - Clean single desktop icon idempotency (no duplicate shortcuts)
            - Bundled Standalone Python Backend Engine Sidecar (`securephotos-engine.exe`)
            - Instant zero-console launch (No console popups, 0ms startup delay)
            - High-Speed Offline Media Ingestion with 2-level thumbnail sharding
            - Zero-Trust AES-256-GCM Encrypted Vault & Multi-Slot Recovery
            - On-Device 4K AI Super-Resolution with AVIF space-saving compression
            - Representative Medoid Face Clustering & Social Affinity Close Ones
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/**/latest.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Workflow Execution Summary ──
      - name: Generate Pipeline Run Summary
        if: always()
        shell: bash
        run: |
          echo "## 🚀 SecurePhotos CI/CD Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Version** | \`${{ steps.version_meta.outputs.tag_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Previous Version** | \`v${{ steps.version_meta.outputs.previous_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bump Type** | \`${{ inputs.release_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Distribution Mode** | \`${{ inputs.distribution_mode }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.distribution_mode }}" = "test_build" ]; then
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> **Test Build Complete**: The setup installer has been uploaded directly as a workflow run artifact and is **NOT** published to the public GitHub Releases page." >> $GITHUB_STEP_SUMMARY
            echo "> You can download the zip from the **Artifacts** section at the top of this run to test the installer locally." >> $GITHUB_STEP_SUMMARY
          else
            echo "> [!SUCCESS]" >> $GITHUB_STEP_SUMMARY
            echo "> **Official Release Published**: \`${{ steps.version_meta.outputs.tag_name }}\` is now live on GitHub Releases." >> $GITHUB_STEP_SUMMARY
          fi
