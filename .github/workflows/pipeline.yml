name: SecurePhotos CI/CD Pipeline

'on':
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version Bump Type'
        required: true
        type: choice
        default: 'patch'
        options:
          - 'patch'
          - 'minor'
          - 'major'
      distribution_mode:
        description: 'Distribution Mode'
        required: true
        type: choice
        default: 'test_build'
        options:
          - 'test_build'
          - 'public_release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: the same checks as quality.yml. If any fails, nothing is built or published.
  validate:
    name: Lint, typecheck, tests & Rust check
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Public releases only from the default branch
        if: inputs.distribution_mode == 'public_release' && github.ref_name != github.event.repository.default_branch
        shell: bash
        run: |
          echo "::error::Public releases can only be made from '${{ github.event.repository.default_branch }}', not '${{ github.ref_name }}'."
          echo "::notice::To try an installer from another branch, choose distribution_mode: test_build."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust & Cargo Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: engine/requirements-dev.txt

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        with:
          # Pinned like quality.yml: "release" can find only nightly builds and fail the run.
          ffmpeg-version: 9.0.2

      - name: Stage FFmpeg Binaries & Resource Directories
        shell: bash
        run: |
          mkdir -p bin data/models build/models
          cp "$(which ffmpeg)" bin/ffmpeg.exe
          cp "$(which ffprobe)" bin/ffprobe.exe
          echo "SecurePhotos AI Models" > data/models/placeholder.txt
          echo "AI models are fetched for release builds only" > build/models/placeholder.txt
          bin/ffmpeg.exe -version
          bin/ffprobe.exe -version

      - name: Run Python Unit & Integration Tests
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements-dev.txt
          python -m ruff check .
          python -m pytest engine/tests

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend Unit Tests (Vitest)
        run: npm test

      - name: Frontend Build & TypeScript Typecheck
        run: npm run build

      - name: Compile Backend Engine Sidecar
        shell: bash
        run: |
          python scripts/build-engine.py

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests (engine access token, engine stops with the app)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test token_rng --test engine_job

  # Job 2: build the installer. A test build is attached to the run; a public release is also
  # tagged and published, with notes taken from CHANGELOG.md.
  package_and_release:
    name: Build the installer and publish
    needs: [validate]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: engine/requirements-dev.txt

      - name: Detect SemVer & Auto-Bump Manifests
        id: version_meta
        shell: bash
        run: |
          git fetch --tags
          python -m pip install --upgrade pip
          python scripts/release_version.py auto-bump --bump "${{ inputs.release_type }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust & Cargo Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile Backend Engine Sidecar
        shell: bash
        run: |
          pip install -r engine/requirements-dev.txt
          python scripts/build-engine.py

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        with:
          # Pinned like quality.yml: "release" can find only nightly builds and fail the run.
          ffmpeg-version: 9.0.2

      - name: Stage FFmpeg Binaries & Resource Directories
        shell: bash
        run: |
          mkdir -p bin data/models build/models
          cp "$(which ffmpeg)" bin/ffmpeg.exe
          cp "$(which ffprobe)" bin/ffprobe.exe
          bin/ffmpeg.exe -version
          bin/ffprobe.exe -version

      # The smaller AI models ship inside the installer, so a fresh install works offline.
      # Pinned commit + SHA-256 (engine/services/ai_models.py); a mismatch stops the build.
      - name: Bundle verified AI models
        shell: bash
        run: python scripts/fetch_models.py build/models

      - name: Build Desktop Installer (NSIS)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Always attach the installer to the run.
      - name: Upload Installer to Run Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SecurePhotos-${{ steps.version_meta.outputs.tag_name }}-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/**/latest.json
          if-no-files-found: error
          retention-days: 14

      # The installer downloads the old-photo models from the models-v1 release. If people can't
      # download them (the repository is private, or a file is missing), don't publish.
      - name: Check the old-photo models can be downloaded
        if: inputs.distribution_mode == 'public_release'
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import create_release as r; f = r.check_on_demand_models_public(); [print('::error::Not downloadable without a login: ' + u) for u in f]; sys.exit(1 if f else 0)"

      - name: Write the release notes from CHANGELOG.md
        if: inputs.distribution_mode == 'public_release'
        shell: bash
        run: python scripts/ci/release_notes.py "${{ steps.version_meta.outputs.next_version }}" release_notes.md

      # Only for a public release from the default branch.
      - name: Publish the GitHub release
        if: inputs.distribution_mode == 'public_release' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: 'SecurePhotos ${{ steps.version_meta.outputs.tag_name }}'
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/**/latest.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run summary
        if: always()
        shell: bash
        run: |
          echo "## SecurePhotos ${{ steps.version_meta.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.version_meta.outputs.tag_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Previous version** | \`v${{ steps.version_meta.outputs.previous_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version bump** | \`${{ inputs.release_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mode** | \`${{ inputs.distribution_mode }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.distribution_mode }}" = "test_build" ]; then
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> **Test build:** the installer is attached to this run under **Artifacts**. Nothing was published." >> $GITHUB_STEP_SUMMARY
          else
            echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
            echo "> **Published:** \`${{ steps.version_meta.outputs.tag_name }}\` is on the GitHub releases page." >> $GITHUB_STEP_SUMMARY
          fi
