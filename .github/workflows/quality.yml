name: Quality Gate

# Runs on every pull request to master and after every merge to master.
# The installer is built and released by pipeline.yml, started by hand.
'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests & Rust check
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: engine/requirements-dev.txt

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        with:
          # Pinned: "release" looks up the newest stable build among GitHub releases, and the newest
          # page can hold only nightly builds, which failed every run on 2026-11-15.
          ffmpeg-version: 9.0.2

      - name: Stage FFmpeg and resource folders
        shell: bash
        run: |
          mkdir -p bin data/models build/models src-tauri/binaries
          cp "$(which ffmpeg)" bin/ffmpeg.exe
          cp "$(which ffprobe)" bin/ffprobe.exe
          echo "placeholder" > data/models/placeholder.txt
          # The installer bundles build/models (filled by scripts/fetch_models.py for releases).
          echo "placeholder" > build/models/placeholder.txt
          # cargo check only needs the sidecar file to exist, not the real PyInstaller build.
          touch src-tauri/binaries/securephotos-engine-x86_64-pc-windows-msvc.exe

      - name: Install Python dependencies (pinned)
        run: python -m pip install -r engine/requirements-dev.txt

      - name: Lint Python (ruff)
        run: python -m ruff check .

      - name: Python tests
        shell: bash
        env:
          PYTHONPATH: .
        run: python -m pytest engine/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies (lock file enforced)
        run: npm ci

      - name: Audit npm dependencies (fail on high severity)
        # Same as `npm audit --audit-level=high`, plus a short, dated list of allowed advisories
        # (each with its reason and end date) in scripts/ci/npm-audit-check.mjs.
        run: node scripts/ci/npm-audit-check.mjs

      - name: Frontend unit tests (Vitest)
        run: npm test

      - name: Typecheck and build frontend
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests (engine access token, engine stops with the app)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test token_rng --test engine_job --test library_dir
