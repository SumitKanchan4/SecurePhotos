name: Release SecurePhotos Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.0.5)'
        default: 'v0.0.5'

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Version Metadata
        id: version_meta
        shell: bash
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          CLEAN_VER="${TAG#v}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust & Cargo Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Desktop Installers (NSIS & MSI)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: 'SecurePhotos ${{ steps.version_meta.outputs.tag_name }}'
          body: |
            ## 🔒 SecurePhotos ${{ steps.version_meta.outputs.tag_name }} — Desktop Release
            
            Download the installer for your Windows PC below:
            - **`SecurePhotos_${{ steps.version_meta.outputs.clean_version }}_x64-setup.exe`**: 1-Click Windows Setup Installer (Recommended)
            - **`SecurePhotos_${{ steps.version_meta.outputs.clean_version }}_x64_en-US.msi`**: Enterprise Windows Installer Package
            
            ### ✨ Features & Capabilities
            - High-Speed Offline Media Ingestion with 2-level thumbnail sharding
            - Zero-Trust AES-256-GCM Encrypted Vault & Multi-Slot Recovery
            - On-Device 4K AI Super-Resolution with AVIF space-saving compression
            - Representative Medoid Face Clustering & Social Affinity Close Ones
            - Beat-Matched Cinematic Ken-Burns Story Player
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/**/latest.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


