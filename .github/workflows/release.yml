name: Release SecurePhotos Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Desktop Installers (NSIS & MSI)
        run: npm run tauri build

      - name: Publish Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'SecurePhotos ${{ github.ref_name }}'
          body: |
            ## 🔒 SecurePhotos ${{ github.ref_name }} — Desktop Release
            
            Download the installer for your Windows PC below:
            - **`SecurePhotos_${{ github.ref_name }}_x64-setup.exe`**: 1-Click Windows Setup Installer (Recommended)
            - **`SecurePhotos_${{ github.ref_name }}_x64_en-US.msi`**: Enterprise Windows Installer Package
            
            ### ✨ What's New
            - High-Speed Offline Media Ingestion with 2-level thumbnail sharding
            - Zero-Trust AES-256-GCM Encrypted Vault & Multi-Slot Recovery
            - On-Device 4K AI Super-Resolution with AVIF space-saving compression
            - Representative Medoid Face Clustering & Social Affinity Close Ones
            - Beat-Matched Cinematic Ken-Burns Story Player
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
